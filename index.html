<!doctype html>
<html lang="zh-CN" data-theme="day">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3eb">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Zou Yihui 的个人主页">
  <title>ZOUYIHUI.ME</title>
  <link rel="icon" href="./assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="./assets/mark-180.png">
  <script>
    try {
      if (localStorage.getItem("zou-home-theme") === "night") {
        document.documentElement.dataset.theme = "night";
        document.querySelector('meta[name="theme-color"]').content = "#202923";
      }
    } catch (_) { /* Storage can be unavailable in private browsing. */ }
  </script>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f3eb;
      --ink: #344c3a;
      --muted: #5e6957;
      --line: #cdd2c3;
      --green: #344f3c;
      --on-green: #f6f5ed;
      --disc: #e7e9dc;
      --disc-light: #fffff5;
      --sun: #eddfb9;
      --shadow: #65725a;
      --shadow-opacity: .18;
      color: var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
    }
    :root[data-theme="night"] {
      color-scheme: dark;
      --paper: #202923;
      --ink: #e5e7d8;
      --muted: #adb6a5;
      --line: #59664f;
      --green: #c7d2b9;
      --on-green: #253629;
      --disc: #303d31;
      --disc-light: #4a5840;
      --sun: #526044;
      --shadow: #0c180f;
      --shadow-opacity: .4;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { min-width: 280px; overflow: hidden; background: var(--paper); transition: background-color 700ms ease; }
    button, a { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    button { color: inherit; }
    button:not(:disabled), a { cursor: pointer; }
    button:disabled { cursor: default; }
    a { color: inherit; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--green); outline-offset: 6px; }
    [hidden] { display: none !important; }
    .skip-link { position: fixed; top: 20px; left: 24px; z-index: 20; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; color: var(--on-green); background: var(--green); transform: translateY(-160%); }
    .skip-link:focus { transform: none; }
    .icon { display: block; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    .atmosphere { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .sunlight { position: absolute; width: 125vmax; height: 125vmax; top: -82vmax; left: -45vmax; background: radial-gradient(ellipse, var(--sun), transparent 65%); opacity: .8; animation: sunlight 26s ease-in-out infinite alternate; }
    .window-light { position: absolute; width: 110vw; height: 150vh; top: -70vh; right: -40vw; transform: rotate(-35deg); background: repeating-linear-gradient(90deg, transparent 0 15%, var(--shadow) 15.5% 17%, transparent 17.7% 30%); filter: blur(13px); opacity: .095; mask-image: linear-gradient(#000, transparent 93%); }
    .leaf-shadow { position: absolute; width: min(78vw, 1070px); height: auto; right: -21vw; top: -20vh; color: var(--shadow); filter: blur(8px); opacity: var(--shadow-opacity); transform-origin: 90% 5%; animation: breeze 19s ease-in-out infinite alternate; }
    .paper-grain { position: absolute; inset: 0; opacity: .05; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.84' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23606b4d' filter='url(%23n)' d='M0 0h180v180H0z'/%3E%3C/svg%3E"); }
    .scene { position: relative; z-index: 1; width: 100%; height: 100svh; display: grid; place-items: center; overflow: hidden; isolation: isolate; }
    .sculpture { position: relative; width: min(61vw, 63svh, 540px); aspect-ratio: 1; animation: arrive 1400ms cubic-bezier(.2,.7,.2,1) both; }
    .art-disc { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 31% 22%, var(--disc-light), var(--disc) 78%); box-shadow: inset 1px 2px 4px #ffffff28, 22px 38px 70px -36px #3d47242b; opacity: .72; }
    .art-disc::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--line) 45%, transparent); }
    .halo { position: absolute; inset: -5%; border: 1px solid var(--line); border-radius: 50%; opacity: .48; animation: breathe 13s ease-in-out infinite alternate; pointer-events: none; }
    .halo.outer { inset: -14%; opacity: .16; animation-delay: -6s; }
    .orbit { position: absolute; inset: -5%; border-radius: 50%; animation: orbit 100s linear infinite; pointer-events: none; }
    .orbit::before { content: ""; position: absolute; width: 5px; height: 5px; left: 50%; top: -2px; border-radius: 50%; background: var(--paper); border: 1px solid var(--muted); opacity: .65; }
    .brand-button { position: absolute; inset: 14%; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: transparent; }
    .mark-tilt { position: absolute; inset: 0; display: grid; place-items: center; transition: transform 350ms ease-out; }
    /* Preserve the original logo geometry, material and transparent canvas margins. */
    .mark-canvas { position: absolute; width: 157%; height: 157%; pointer-events: none; visibility: hidden; }
    .mark-still { position: absolute; width: 89%; height: auto; pointer-events: none; }
    html[data-mark-ready="true"] .mark-canvas { visibility: visible; }
    html[data-mark-ready="true"] .mark-still { visibility: hidden; }
    .theme-switch { position: fixed; z-index: 4; top: max(28px, env(safe-area-inset-top)); right: max(32px, env(safe-area-inset-right)); display: flex; align-items: center; gap: 3px; padding: 4px; border: 1px solid color-mix(in srgb, var(--line) 65%, transparent); border-radius: 999px; background: color-mix(in srgb, var(--paper) 35%, transparent); }
    .theme-choice { display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--muted); transition: background-color 250ms ease, color 250ms ease; }
    .theme-choice .icon { width: 17px; height: 17px; }
    .theme-choice[aria-pressed="true"] { background: var(--green); color: var(--on-green); }
    .theme-choice:focus-visible { outline-offset: 3px; }
    .entry-nav { position: fixed; z-index: 4; left: 50%; bottom: max(32px, env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 12px; transform: translateX(-50%); }
    .entry { display: grid; place-items: center; width: 58px; height: 58px; border: 1px solid var(--green); border-radius: 50%; color: var(--on-green); background: var(--green); text-decoration: none; box-shadow: 0 5px 20px #2434230d; transition: transform 220ms ease, box-shadow 220ms ease; }
    .entry .icon { width: 22px; height: 22px; transition: transform 220ms ease; }
    .entry.secondary { width: 48px; height: 48px; border-color: var(--line); color: var(--muted); background: color-mix(in srgb, var(--paper) 55%, transparent); box-shadow: none; }
    .entry.secondary .icon { width: 18px; height: 18px; }
    .entry:hover { transform: translateY(-3px); box-shadow: 0 10px 25px #2434231a; }
    .entry:not(.secondary):hover .icon { transform: translateX(2px); }
    .entry:active { transform: scale(.96); }
    .motion-controls { position: fixed; z-index: 4; left: max(27px, env(safe-area-inset-left)); bottom: max(39px, env(safe-area-inset-bottom)); }
    .quiet-button { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 1px solid transparent; border-radius: 50%; background: transparent; color: var(--muted); opacity: .7; transition: opacity 200ms ease, border-color 200ms ease; }
    .quiet-button .icon { width: 16px; height: 16px; }
    .quiet-button:hover, .quiet-button:focus-visible { opacity: 1; border-color: var(--line); }
    .quiet-button:disabled { opacity: .4; }
    .play-icon, #motionButton[aria-pressed="true"] .pause-icon { display: none; }
    #motionButton[aria-pressed="true"] .play-icon { display: block; }
    .ripple { position: absolute; z-index: -1; width: 34px; height: 34px; margin: -17px 0 0 -17px; border: 1px solid var(--line); border-radius: 50%; pointer-events: none; animation: ripple 2.8s cubic-bezier(.15,.4,.3,1) both; }
    html[data-motion-paused="true"] .atmosphere *, html[data-motion-paused="true"] .sculpture, html[data-motion-paused="true"] .sculpture *, html[data-motion-paused="true"] .ripple { animation-play-state: paused !important; }
    @keyframes arrive { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes sunlight { from { transform: translate3d(-1%, 0, 0); opacity: .65; } to { transform: translate3d(3%, 2%, 0); opacity: .95; } }
    @keyframes breeze { from { transform: rotate(-12deg) translate3d(0, 0, 0); } to { transform: rotate(-5deg) translate3d(-1%, 1%, 0); } }
    @keyframes breathe { from { transform: scale(.992); } to { transform: scale(1.025); } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes ripple { from { opacity: .6; transform: scale(1); } to { opacity: 0; transform: scale(12); } }
    @media (max-width: 700px) {
      .sculpture { width: min(72vw, 52svh, 390px); }
      .theme-switch { top: max(20px, env(safe-area-inset-top)); right: max(20px, env(safe-area-inset-right)); }
      .leaf-shadow { width: 690px; right: -410px; top: -65px; opacity: calc(var(--shadow-opacity) * .8); }
      .entry-nav { bottom: max(28px, env(safe-area-inset-bottom)); }
      .motion-controls { left: max(16px, env(safe-area-inset-left)); bottom: max(35px, env(safe-area-inset-bottom)); }
      .halo.outer { inset: -10%; }
    }
    @media (max-height: 480px) and (orientation: landscape) {
      .sculpture { width: 65svh; }
      .entry-nav { left: auto; right: 25px; bottom: 25px; transform: none; }
      .motion-controls { bottom: 25px; }
      .theme-switch { top: 20px; right: 25px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .mark-tilt { transform: none !important; }
      .motion-controls { display: none; }
    }
    @media (forced-colors: active) {
      .atmosphere, .art-disc, .halo, .orbit { display: none; }
      .theme-choice[aria-pressed="true"] { outline: 1px solid ButtonText; }
    }
  </style></head>
<body>
  <a class="skip-link" href="#entryNav" aria-label="跳到入口"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5M5 20h14"/></svg></a>
  <div class="atmosphere" aria-hidden="true">
    <div class="sunlight"></div>
    <div class="window-light"></div>
    <svg class="leaf-shadow" viewBox="0 0 760 850" fill="currentColor">
      <path d="M759 12C632 190 626 342 477 505S301 711 262 850" fill="none" stroke="currentColor" stroke-width="9"/>
      <path d="M646 220C554 209 508 149 511 62C595 92 646 136 646 220ZM647 219C659 119 704 77 760 81C753 157 711 207 647 219ZM603 343C512 335 451 276 446 185C537 209 597 269 603 343ZM603 343C618 248 682 209 754 211C733 299 679 342 603 343ZM527 455C425 440 380 382 382 298C462 313 521 372 527 455ZM527 455C574 361 637 333 714 351C676 430 609 468 527 455ZM423 567C332 549 282 477 295 398C378 428 423 477 423 567ZM423 567C468 481 526 465 601 487C557 563 495 591 423 567ZM335 699C258 671 216 616 222 541C302 564 338 621 335 699ZM335 699C377 621 442 606 506 629C461 700 402 723 335 699Z"/>
      <path d="M603 343Q431 231 308 261M477 505Q589 559 675 553" fill="none" stroke="currentColor" stroke-width="5"/>
      <path d="M434 270C364 246 335 195 355 144C410 173 440 217 434 270ZM383 257C338 302 294 316 250 293C288 253 335 234 383 257ZM581 543C597 491 625 465 673 467C660 513 629 539 581 543ZM581 543C634 546 665 575 671 618C618 613 588 586 581 543Z"/>
    </svg>
    <div class="paper-grain"></div>
  </div>
  <main class="scene" aria-label="Zou Yihui 的个人主页">
    <div class="sculpture">
      <div class="halo outer" aria-hidden="true"></div>
      <div class="halo" aria-hidden="true"></div>
      <div class="art-disc" aria-hidden="true"></div>
      <div class="orbit" aria-hidden="true"></div>
      <button class="brand-button" id="brandButton" type="button" aria-label="重新播放标志动画" disabled>
        <span class="mark-tilt">
          <canvas class="mark-canvas" id="markCanvas" aria-hidden="true"></canvas>
          <img class="mark-still" src="./assets/mark-still.png" alt="Zou Yihui 标志" width="500" height="500">
        </span>
      </button>
    </div>
  </main>
  <div class="theme-switch" role="group" aria-label="主题" hidden>
    <button class="theme-choice" type="button" data-theme-choice="day" aria-label="日光主题" aria-pressed="true"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.2"/><path d="M10 1.5v2m0 13v2M1.5 10h2m13 0h2M4 4l1.4 1.4m9.2 9.2L16 16M4 16l1.4-1.4m9.2-9.2L16 4"/></svg></button>
    <button class="theme-choice" type="button" data-theme-choice="night" aria-label="夜读主题" aria-pressed="false"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16.6 12.1A7 7 0 0 1 7.9 3.4a7 7 0 1 0 8.7 8.7Z"/></svg></button>
  </div>
  <nav class="entry-nav" id="entryNav" aria-label="主页入口">
    <a class="entry" href="./personal/" aria-label="进入个人空间"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 4h6a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-6M3 12h12m-4-4 4 4-4 4"/></svg></a>
    <a class="entry secondary" href="./apps/admin/" aria-label="管理后台"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></a>
  </nav>
  <div class="motion-controls" hidden>
    <button class="quiet-button" id="motionButton" type="button" aria-pressed="false" aria-label="暂停动画">
      <svg class="icon pause-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5v10m6-10v10"/></svg>
      <svg class="icon play-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 8 6-8 6Z"/></svg>
    </button>
  </div>
  <script type="module">
    const root = document.documentElement;
    const themeButtons = document.querySelectorAll("[data-theme-choice]");
    function setTheme(theme) {
      root.dataset.theme = theme;
      themeButtons.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.themeChoice === theme)));
      document.querySelector('meta[name="theme-color"]').content = theme === "night" ? "#202923" : "#f5f3eb";
      try { localStorage.setItem("zou-home-theme", theme); } catch (_) {}
    }
    setTheme(root.dataset.theme);
    themeButtons.forEach(button => button.addEventListener("click", () => setTheme(button.dataset.themeChoice)));
    document.querySelector(".theme-switch").hidden = false;

    const canvas = document.getElementById("markCanvas");
    const brandButton = document.getElementById("brandButton");
    const motionButton = document.getElementById("motionButton");
    const tilt = document.querySelector(".mark-tilt");
    const controls = document.querySelector(".motion-controls");
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
    const diagnostics = new URLSearchParams(location.search).has("perf");
    const stats = { frames: 0, callbacks: 0, markDraws: 0 };
    let mark = null, timeline = null, animationFrame = 0, lastRender = 0;
    let elapsed = 0, userPaused = false, lastTick = 0;
    const formingSteps = innerWidth <= 700 ? 80 : 96;

    function stop() {
      cancelAnimationFrame(animationFrame);
      animationFrame = 0;
      lastTick = 0;
      lastRender = 0;
      delete root.dataset.rendering;
    }
    function shouldAnimate() { return mark && !document.hidden && !reduceMotion.matches && !userPaused; }
    function schedule() {
      if (animationFrame || !shouldAnimate()) return;
      root.dataset.rendering = "true";
      animationFrame = requestAnimationFrame(render);
    }
    function fallback(error) {
      stop();
      mark = null;
      delete root.dataset.markReady;
      root.dataset.markFallback = "true";
      brandButton.disabled = true;
      if (diagnostics) console.warn("标志使用静帧：", error?.message || "WebGL context unavailable");
    }
    function draw() {
      try {
        mark.draw(elapsed, formingSteps);
        stats.markDraws += 1;
        root.dataset.markReady = "true";
        return true;
      } catch (error) { fallback(error); return false; }
    }
    function render(now) {
      animationFrame = 0;
      if (!shouldAnimate()) return;
      stats.callbacks += 1;
      if (lastTick) elapsed += Math.min(now - lastTick, 100) / 1000;
      lastTick = now;
      const interval = elapsed < timeline.HOLD ? 30 : 50;
      if (!lastRender || now - lastRender >= interval) {
        lastRender = now;
        stats.frames += 1;
        if (!draw()) return;
      }
      schedule();
    }
    function syncControls() {
      const paused = userPaused || reduceMotion.matches;
      brandButton.disabled = !mark || reduceMotion.matches;
      motionButton.disabled = reduceMotion.matches;
      motionButton.setAttribute("aria-pressed", String(paused));
      root.dataset.motionPaused = String(paused || document.hidden);
      motionButton.setAttribute("aria-label", userPaused ? "继续动画" : "暂停动画");
    }
    function replay() {
      if (!mark || reduceMotion.matches) return;
      stop();
      elapsed = 0;
      userPaused = false;
      mark.reset();
      syncControls();
      schedule();
    }
    motionButton.addEventListener("click", () => {
      userPaused = !userPaused;
      if (userPaused) {
        stop();
        if (mark && elapsed < timeline.HOLD) { elapsed = timeline.HOLD; draw(); }
        document.querySelector('.sculpture').getAnimations().forEach(animation => animation.finish());
      } else schedule();
      tilt.style.transform = "none";
      syncControls();
    });
    brandButton.addEventListener("click", replay);
    brandButton.addEventListener("pointermove", event => {
      if (!shouldAnimate() || event.pointerType !== "mouse") return;
      const box = brandButton.getBoundingClientRect();
      const x = (event.clientX - box.left) / box.width - .5;
      const y = (event.clientY - box.top) / box.height - .5;
      tilt.style.transform = `perspective(800px) rotateX(${-y * 6}deg) rotateY(${x * 7}deg)`;
    }, { passive: true });
    brandButton.addEventListener("pointerleave", () => { tilt.style.transform = "none"; }, { passive: true });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) stop(); else schedule();
      syncControls();
    });
    const scene = document.querySelector(".scene");
    scene.addEventListener("pointerdown", event => {
      if (reduceMotion.matches || userPaused || event.target.closest("button, a") || scene.querySelectorAll(".ripple").length >= 4) return;
      const ring = document.createElement("span");
      ring.className = "ripple";
      ring.setAttribute("aria-hidden", "true");
      ring.style.left = `${event.clientX}px`;
      ring.style.top = `${event.clientY}px`;
      ring.addEventListener("animationend", () => ring.remove(), { once: true });
      scene.append(ring);
    }, { passive: true });
    reduceMotion.addEventListener("change", () => {
      stop();
      tilt.style.transform = "none";
      scene.querySelectorAll(".ripple").forEach(ring => ring.remove());
      if (mark && reduceMotion.matches) { elapsed = Math.max(elapsed, timeline.HOLD); draw(); }
      syncControls();
      schedule();
    });
    canvas.addEventListener("webglcontextlost", event => { event.preventDefault(); fallback(); });
    if (diagnostics) window.__homeMotionDiagnostics = () => ({ ...stats, rafRunning: Boolean(animationFrame), rendering: root.dataset.rendering === "true", elapsed, paused: userPaused, reducedMotion: reduceMotion.matches });
    controls.hidden = false;
    syncControls();
    try {
      const engine = await import("./assets/mark-metal.js");
      timeline = engine.TIMELINE;
      mark = engine.createMark(canvas);
      syncControls();
      if (reduceMotion.matches) { elapsed = timeline.HOLD; draw(); }
      else schedule();
    } catch (error) { fallback(error); }
  </script>
</body>
</html>
