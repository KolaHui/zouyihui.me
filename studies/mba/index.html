<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eee9de">
  <meta name="color-scheme" content="light">
  <title>工商管理硕士 · 试卷库</title>
  <link rel="icon" href="../../assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="../../assets/mark-180.png">
  <style>
    :root {
      color-scheme: light;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-synthesis: none;
      --ink: #20241f;
      --muted: #70766d;
      --paper: #fffdf8;
      --canvas: #eee9de;
      --line: rgba(80, 72, 57, .16);
      --red: #a53c32;
      --red-deep: #72251f;
      --gold: #b99555;
      --green: #315f50;
      --focus: rgba(165, 60, 50, .22);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; scroll-behavior: smooth; }
    body {
      min-height: 100%;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 0%, rgba(255, 255, 255, .9), transparent 36rem),
        repeating-linear-gradient(90deg, rgba(70, 58, 38, .021) 0 1px, transparent 1px 7px),
        var(--canvas);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    button { font: inherit; }
    .shell { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 0 max(52px, env(safe-area-inset-bottom)); }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      min-height: 48px;
      padding: 7px 15px 7px 8px;
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: 17px;
      color: #485047;
      background: rgba(255, 253, 248, .6);
      box-shadow: 0 8px 30px rgba(56, 46, 30, .06), inset 0 1px 0 #fff;
      text-decoration: none;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }
    .back:hover { transform: translateY(-2px); box-shadow: 0 13px 34px rgba(56, 46, 30, .1), inset 0 1px 0 #fff; }
    .back img { width: 34px; height: 34px; }
    .back span { font-size: 13px; font-weight: 650; }
    .archive-id { color: rgba(66, 72, 64, .54); font: 650 10px/1.2 ui-monospace, "SFMono-Regular", Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; }
    .hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 32px;
      padding: clamp(70px, 12vw, 132px) 0 clamp(42px, 7vw, 72px);
      border-bottom: 1px solid var(--line);
    }
    .eyebrow { margin: 0 0 13px; color: var(--red); font: 720 11px/1 ui-monospace, "SFMono-Regular", Menlo, monospace; letter-spacing: .2em; }
    h1 { margin: 0; font: 800 clamp(42px, 8vw, 82px)/.98 "Songti SC", "STSong", serif; letter-spacing: -.055em; }
    .lede { max-width: 590px; margin: 22px 0 0; color: var(--muted); font-size: clamp(14px, 1.8vw, 16px); line-height: 1.75; }
    .seal {
      width: clamp(92px, 12vw, 126px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 4px double rgba(165, 60, 50, .58);
      border-radius: 50%;
      color: rgba(137, 43, 36, .84);
      font: 760 clamp(16px, 2vw, 21px)/1.18 "Songti SC", serif;
      letter-spacing: .1em;
      text-align: center;
      transform: rotate(7deg);
      box-shadow: inset 0 0 0 5px rgba(165, 60, 50, .035);
      animation: seal-in 720ms 160ms cubic-bezier(.2, .9, .2, 1) both;
    }
    .controls { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 25px 0 22px; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter {
      min-height: 44px;
      padding: 0 17px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 253, 248, .54);
      cursor: pointer;
      transition: color 160ms ease, border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }
    .filter:hover { color: var(--red-deep); border-color: rgba(165, 60, 50, .28); transform: translateY(-1px); }
    .filter[aria-pressed="true"] { color: #fff; border-color: var(--ink); background: var(--ink); }
    .count { color: var(--muted); font: 640 11px/1 ui-monospace, "SFMono-Regular", Menlo, monospace; letter-spacing: .08em; white-space: nowrap; }
    .papers { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
    .paper {
      position: relative;
      grid-column: span 6;
      min-height: 310px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: clamp(24px, 4vw, 34px);
      border: 1px solid var(--line);
      border-radius: 21px;
      background: var(--paper);
      box-shadow: 0 14px 45px rgba(61, 50, 32, .075);
      text-decoration: none;
      transition: transform 280ms cubic-bezier(.2, .9, .2, 1), box-shadow 280ms ease, border-color 220ms ease;
      animation: paper-in 620ms 220ms cubic-bezier(.2, .9, .2, 1) both;
    }
    .paper::after {
      content: "01";
      position: absolute;
      right: -9px;
      bottom: -39px;
      color: rgba(96, 81, 57, .05);
      font: 800 154px/1 Georgia, serif;
      letter-spacing: -.08em;
      pointer-events: none;
    }
    .paper:hover { transform: translateY(-6px); border-color: rgba(165, 60, 50, .24); box-shadow: 0 24px 64px rgba(61, 50, 32, .13); }
    .paper:focus-visible, .filter:focus-visible, .back:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
    .paper[hidden] { display: none; }
    .paper-top { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    .tag { padding: 6px 10px; border-radius: 7px; color: var(--red-deep); background: #f5e6e1; font-size: 11px; font-weight: 720; letter-spacing: .08em; }
    .status { display: flex; align-items: center; gap: 7px; color: var(--green); font-size: 11px; font-weight: 650; }
    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #4b8a71; box-shadow: 0 0 0 5px rgba(75, 138, 113, .1); }
    .paper h2 { max-width: 490px; margin: 36px 0 12px; font: 800 clamp(26px, 3.7vw, 39px)/1.18 "Songti SC", "STSong", serif; letter-spacing: -.035em; }
    .paper p { max-width: 500px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .meta { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: auto; padding-top: 34px; color: #646a61; font-size: 11px; }
    .meta span { display: inline-flex; align-items: center; gap: 7px; }
    .meta span::before { content: ""; width: 3px; height: 3px; border-radius: 50%; background: var(--gold); }
    .open-label { position: absolute; z-index: 2; right: 26px; top: 50%; width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; color: var(--red); background: rgba(255, 255, 255, .76); transform: translateY(-50%); transition: transform 220ms ease, background 220ms ease; }
    .open-label::before { content: ""; width: 7px; height: 7px; border-top: 1.5px solid currentColor; border-right: 1.5px solid currentColor; transform: rotate(45deg) translate(-1px, 1px); }
    .paper:hover .open-label { background: #fff; transform: translate(4px, -50%); }
    .empty { display: none; grid-column: 1 / -1; padding: 54px 24px; border: 1px dashed rgba(80, 72, 57, .22); border-radius: 20px; color: var(--muted); text-align: center; background: rgba(255, 253, 248, .38); }
    .empty.visible { display: block; }
    footer { display: flex; justify-content: space-between; gap: 20px; margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--line); color: rgba(63, 69, 62, .48); font-size: 11px; }
    @keyframes paper-in { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes seal-in { from { opacity: 0; transform: rotate(-4deg) scale(.78); } to { opacity: 1; transform: rotate(7deg) scale(1); } }
    @media (max-width: 760px) {
      .shell { width: min(100% - 22px, 1120px); }
      .archive-id { display: none; }
      .hero { grid-template-columns: 1fr; padding-top: 60px; }
      .seal { position: absolute; right: 7px; top: 48px; opacity: .74; }
      .lede { max-width: 82%; }
      .controls { align-items: flex-start; flex-direction: column; }
      .paper { grid-column: 1 / -1; min-height: 330px; padding: 24px 21px; }
      .open-label { right: 20px; top: auto; bottom: 20px; transform: none; }
      .paper:hover .open-label { transform: translateX(4px); }
      footer { flex-direction: column; }
    }
    @media (max-width: 460px) {
      h1 { font-size: 43px; }
      .seal { width: 82px; right: 4px; top: 54px; font-size: 14px; }
      .lede { max-width: 100%; }
      .filter { flex: 1 1 auto; padding: 0 13px; }
      .paper h2 { max-width: calc(100% - 30px); font-size: 29px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="back" href="../../personal/" aria-label="返回我的个人空间"><img src="../../assets/mark-icon-small.png" srcset="../../assets/mark-icon-small.png 1x, ../../assets/mark-icon.png 2x" alt="" width="34" height="34"><span>我的个人空间</span></a>
      <span class="archive-id">Study archive · MBA 001</span>
    </header>

    <section class="hero" aria-labelledby="pageTitle">
      <div>
        <p class="eyebrow">MBA · MPA · MEM · MPACC</p>
        <h1 id="pageTitle">工商管理硕士</h1>
        <p class="lede">管理类联考综合能力试卷库。按类别整理基础卷、历年真题与模拟题，作答进度只保存在当前设备。</p>
      </div>
      <div class="seal" aria-hidden="true">管综<br>试卷库</div>
    </section>

    <section aria-labelledby="paperHeading">
      <div class="controls">
        <div class="filters" role="group" aria-label="试卷分类">
          <button class="filter" type="button" data-filter="all" aria-pressed="true">全部</button>
          <button class="filter" type="button" data-filter="foundation" aria-pressed="false">基础卷</button>
          <button class="filter" type="button" data-filter="past" aria-pressed="false">历年真题</button>
          <button class="filter" type="button" data-filter="mock" aria-pressed="false">模拟题</button>
        </div>
        <span class="count" id="paperCount" aria-live="polite">1 份试卷</span>
      </div>

      <h2 id="paperHeading" hidden>试卷列表</h2>
      <div class="papers" id="paperList">
        <a class="paper" href="./papers/foundation-1/" data-category="foundation">
          <div class="paper-top"><span class="tag">基础卷</span><span class="status">可作答</span></div>
          <h2>管理类联考综合能力<br>基础卷（一）</h2>
          <p>完整文字答题版，包含数学、逻辑推理与两篇写作。支持计时、题号导航、标记和本机自动保存。</p>
          <div class="meta"><span>180 分钟</span><span>55 道选择题</span><span>2 篇写作</span><span>200 分</span></div>
          <span class="open-label" aria-hidden="true"></span>
        </a>
        <p class="empty" id="emptyState">这个分类暂时还没有试卷。</p>
      </div>
    </section>

    <footer><span>答案与作文仅保存在当前浏览器</span><span>后续试卷将继续按类别归档</span></footer>
  </main>

  <script>
    (() => {
      const filters = [...document.querySelectorAll(".filter")];
      const papers = [...document.querySelectorAll(".paper")];
      const count = document.querySelector("#paperCount");
      const empty = document.querySelector("#emptyState");

      function applyFilter(category) {
        let visible = 0;
        filters.forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.filter === category)));
        papers.forEach((paper) => {
          const show = category === "all" || paper.dataset.category === category;
          paper.hidden = !show;
          if (show) visible += 1;
        });
        count.textContent = `${visible} 份试卷`;
        empty.classList.toggle("visible", visible === 0);
      }

      filters.forEach((button) => button.addEventListener("click", () => applyFilter(button.dataset.filter)));
    })();
  </script>
</body>
</html>
