<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文件传输</title>
  <style>
    :root {
      --bg: #f5f7ff;
      --panel: rgba(255, 255, 255, 0.78);
      --ink: rgba(15, 23, 42, 0.92);
      --muted: rgba(15, 23, 42, 0.55);
      --line: rgba(15, 23, 42, 0.14);
      --accent: #2f6bff;
      --accent-dark: #4a8dff;
      --accent-soft: rgba(47, 107, 255, 0.12);
      --green: #0e9f6e;
      --red: #e02424;
      --shadow: 0 20px 50px rgba(15, 23, 42, 0.1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px clamp(12px, 3vw, 40px) 60px;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 780px at 12% 10%, rgba(47, 107, 255, 0.18), transparent 60%),
        radial-gradient(980px 680px at 88% 28%, rgba(255, 96, 200, 0.12), transparent 55%),
        linear-gradient(180deg, #f8faff, #eef2ff 60%, #f7f9ff);
    }

    .page { width: min(680px, 100%); margin: 0 auto; }

    header.top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    header.top h1 { margin: 0; font-size: clamp(22px, 4vw, 28px); }

    a.back-home {
      color: var(--accent-dark);
      font-size: 13px;
      text-decoration: none;
      font-weight: 600;
    }

    .panel {
      padding: clamp(18px, 3vw, 28px);
      border: 1px solid rgba(255, 255, 255, 0.86);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .hint { margin: 0 0 16px; color: var(--muted); font-size: 13px; line-height: 1.7; }

    .token-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .token-row label { font-size: 13px; font-weight: 700; color: var(--muted); }

    .token-row input {
      flex: 1;
      min-width: 160px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      background: rgba(255, 255, 255, 0.85);
    }

    .drop-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 180px;
      padding: 24px;
      border: 2px dashed rgba(47, 107, 255, 0.4);
      border-radius: 16px;
      background: rgba(47, 107, 255, 0.04);
      text-align: center;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .drop-zone.dragover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .drop-zone .big { font-size: 15px; font-weight: 700; }
    .drop-zone .small { font-size: 12px; color: var(--muted); }

    .pick-buttons { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 18px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }

    button.primary {
      color: #fff;
      background: linear-gradient(120deg, var(--accent), var(--accent-dark));
      box-shadow: 0 10px 26px rgba(47, 107, 255, 0.28);
    }

    button.secondary {
      color: var(--accent-dark);
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(47, 107, 255, 0.24);
    }

    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .file-list { margin-top: 16px; font-size: 13px; }

    .file-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-bottom: 1px solid rgba(15, 23, 42, 0.07);
    }

    .file-item .name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-item .size { color: var(--muted); font-size: 12px; }
    .file-item .status { font-weight: 700; font-size: 12px; min-width: 64px; text-align: right; }
    .file-item .status.pending { color: var(--muted); }
    .file-item .status.uploading { color: var(--accent-dark); }
    .file-item .status.done { color: var(--green); }
    .file-item .status.failed { color: var(--red); }

    /* App Store 风格圆环进度 */
    .file-item svg.ring {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      transform: rotate(-90deg);
    }

    .ring circle { fill: none; stroke-width: 4; }
    .ring .ring-track { stroke: rgba(15, 23, 42, 0.12); }

    .ring .ring-fill {
      stroke: var(--accent);
      stroke-linecap: round;
      stroke-dasharray: 81.68;
      stroke-dashoffset: 81.68;
      transition: stroke-dashoffset 0.2s ease;
    }

    .ring .ring-fill.done { stroke: var(--green); stroke-dashoffset: 0; }
    .ring .ring-fill.failed { stroke: var(--red); stroke-dashoffset: 0; }

    .summary { margin-top: 12px; font-size: 13px; color: var(--muted); }
    .summary.ok { color: var(--green); font-weight: 700; }
    .summary.bad { color: var(--red); font-weight: 700; }

    .retry-row { margin-top: 10px; display: none; }
    .retry-row.show { display: block; }

    .text-send {
      display: flex;
      gap: 10px;
      align-items: stretch;
      margin-top: 14px;
    }

    .text-send textarea {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      background: rgba(255, 255, 255, 0.85);
      resize: vertical;
      min-height: 64px;
    }

    .text-send button { align-self: flex-end; }

    @media (max-width: 560px) {
      .text-send { flex-direction: column; }
      .text-send button { align-self: stretch; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="top">
      <h1>文件传输</h1>
      <a class="back-home" href="../../index.html">← 返回入口</a>
    </header>

    <section class="panel">
      <p class="hint">把文件安全传送到指定存储目录。支持任意文件和整个文件夹，文件夹会保留层级。</p>

      <div class="token-row">
        <label for="tokenInput">传输口令</label>
        <input id="tokenInput" type="password" placeholder="输入口令后开始上传" autocomplete="off" />
      </div>

      <div class="drop-zone" id="dropZone">
        <div class="big">把文件拖到这里</div>
        <div class="small">或者点下面的按钮选择</div>
        <div class="pick-buttons">
          <button class="primary" id="pickFilesBtn" type="button">选择文件</button>
          <button class="secondary" id="pickFolderBtn" type="button">选择文件夹</button>
        </div>
      </div>

      <input id="fileInput" type="file" multiple hidden />
      <input id="folderInput" type="file" webkitdirectory hidden />

      <div class="text-send">
        <textarea id="textInput" rows="3" placeholder="或者把一段文本粘贴到这里，存成 txt 传过去"></textarea>
        <button class="secondary" id="sendTextBtn" type="button">上传文本</button>
      </div>

      <div class="file-list" id="fileList"></div>
      <div class="summary" id="summary"></div>
      <div class="retry-row" id="retryRow">
        <button class="secondary" id="retryBtn" type="button">重试失败的文件</button>
      </div>
    </section>
  </div>

  <script src="../../config/ai.config.js"></script>
  <script>
    (() => {
      const apiBase = String(window.AI_API_BASE_URL || "").replace(/\/$/, "");
      const uploadUrl = (relPath) => `${apiBase}/api/upload?path=${encodeURIComponent(relPath)}`;

      const tokenInput = document.getElementById("tokenInput");
      const dropZone = document.getElementById("dropZone");
      const fileInput = document.getElementById("fileInput");
      const folderInput = document.getElementById("folderInput");
      const fileList = document.getElementById("fileList");
      const summary = document.getElementById("summary");

      const TOKEN_KEY = "file_drop_token";
      tokenInput.value = localStorage.getItem(TOKEN_KEY) || "";
      tokenInput.addEventListener("input", () => localStorage.setItem(TOKEN_KEY, tokenInput.value.trim()));

      const CONCURRENCY = 3;
      let uploading = false;
      let queue = [];

      const retryRow = document.getElementById("retryRow");
      const retryBtn = document.getElementById("retryBtn");

      function formatSize(bytes) {
        if (bytes >= 1024 * 1024 * 1024) return (bytes / 1024 / 1024 / 1024).toFixed(2) + " GB";
        if (bytes >= 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + " MB";
        if (bytes >= 1024) return (bytes / 1024).toFixed(0) + " KB";
        return bytes + " B";
      }

      function formatSpeed(bytesPerSec) {
        if (!bytesPerSec || !Number.isFinite(bytesPerSec)) return "";
        if (bytesPerSec >= 1024 * 1024) return (bytesPerSec / 1024 / 1024).toFixed(1) + " MB/s";
        return Math.max(1, Math.round(bytesPerSec / 1024)) + " KB/s";
      }

      function setSummary(kind, text) {
        summary.className = "summary" + (kind ? ` ${kind}` : "");
        summary.textContent = text || "";
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function renderQueue() {
        fileList.innerHTML = queue
          .map(
            (item, i) => `
            <div class="file-item">
              <span class="name" title="${escapeHtml(item.relPath)}">${escapeHtml(item.relPath)}</span>
              <span class="size">${formatSize(item.file.size)}</span>
              <svg class="ring" viewBox="0 0 32 32">
                <circle class="ring-track" cx="16" cy="16" r="13"></circle>
                <circle class="ring-fill" id="ring-${i}" cx="16" cy="16" r="13"></circle>
              </svg>
              <span class="status pending" id="st-${i}">等待</span>
            </div>`
          )
          .join("");
      }

      const RING_LEN = 81.68;

      function uploadOne(item, index, token) {
        return new Promise((resolve) => {
          const st = document.getElementById(`st-${index}`);
          const ring = document.getElementById(`ring-${index}`);
          st.className = "status uploading";
          st.textContent = "0%";
          ring.setAttribute("class", "ring-fill");
          ring.style.strokeDashoffset = RING_LEN;

          const xhr = new XMLHttpRequest();
          xhr.open("POST", uploadUrl(item.relPath));
          xhr.setRequestHeader("Authorization", `Bearer ${token}`);
          xhr.setRequestHeader("Content-Type", "application/octet-stream");
          xhr.timeout = 30 * 60 * 1000;

          const startedAt = Date.now();
          xhr.upload.onprogress = (e) => {
            if (!e.lengthComputable) return;
            const pct = Math.round((e.loaded / e.total) * 100);
            const speed = e.loaded / Math.max(0.5, (Date.now() - startedAt) / 1000);
            ring.style.strokeDashoffset = RING_LEN * (1 - e.loaded / e.total);
            st.textContent = `${pct}% ${formatSpeed(speed)}`;
          };

          const finish = (ok, message) => {
            item.status = ok ? "done" : "failed";
            ring.style.strokeDashoffset = 0;
            if (ok) {
              st.className = "status done";
              st.textContent = "✓ 完成";
              ring.setAttribute("class", "ring-fill done");
            } else {
              st.className = "status failed";
              st.textContent = "✗ " + (message || "失败");
              ring.setAttribute("class", "ring-fill failed");
            }
            resolve();
          };

          xhr.onload = () => {
            let data = {};
            try { data = JSON.parse(xhr.responseText || "{}"); } catch {}
            if (xhr.status >= 200 && xhr.status < 300) finish(true);
            else finish(false, data.error || `HTTP ${xhr.status}`);
          };
          xhr.onerror = () => finish(false, "网络错误");
          xhr.ontimeout = () => finish(false, "超时");
          xhr.send(item.file);
        });
      }

      async function runQueue(token) {
        uploading = true;
        retryRow.classList.remove("show");
        const pending = queue.map((item, index) => ({ item, index })).filter(({ item }) => item.status !== "done");
        let cursor = 0;
        let finished = 0;

        const worker = async () => {
          while (cursor < pending.length) {
            const { item, index } = pending[cursor];
            cursor += 1;
            await uploadOne(item, index, token);
            finished += 1;
            setSummary("", `进度 ${finished} / ${pending.length}（${CONCURRENCY} 个并行）…`);
          }
        };
        await Promise.all(Array.from({ length: Math.min(CONCURRENCY, pending.length) }, worker));

        uploading = false;
        const failed = queue.filter((item) => item.status === "failed").length;
        const done = queue.filter((item) => item.status === "done").length;
        if (failed) {
          setSummary("bad", `完成 ${done} 个，失败 ${failed} 个。请检查访问口令或稍后重试。`);
          retryRow.classList.add("show");
        } else {
          setSummary("ok", `全部完成！${done} 个文件已安全保存。`);
        }
      }

      function uploadAll(files) {
        if (uploading) return;
        const token = tokenInput.value.trim();
        if (!token) {
          setSummary("bad", "请先输入传输口令。");
          tokenInput.focus();
          return;
        }
        const items = Array.from(files).filter((f) => f.size >= 0);
        if (!items.length) return;

        queue = items.map((file) => ({
          file,
          relPath: file.webkitRelativePath || file.name,
          status: "pending",
        }));
        renderQueue();
        runQueue(token);
      }

      const textInput = document.getElementById("textInput");
      document.getElementById("sendTextBtn").addEventListener("click", () => {
        const text = textInput.value;
        if (!text.trim()) {
          setSummary("bad", "文本是空的。");
          return;
        }
        const now = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        const name = `文本_${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}.txt`;
        const file = new File([text], name, { type: "text/plain" });
        uploadAll([file]);
        textInput.value = "";
      });

      retryBtn.addEventListener("click", () => {
        if (uploading || !queue.length) return;
        const token = tokenInput.value.trim();
        if (!token) return;
        queue.forEach((item) => {
          if (item.status === "failed") item.status = "pending";
        });
        runQueue(token);
      });

      document.getElementById("pickFilesBtn").addEventListener("click", () => fileInput.click());
      document.getElementById("pickFolderBtn").addEventListener("click", () => folderInput.click());
      fileInput.addEventListener("change", () => { uploadAll(fileInput.files); fileInput.value = ""; });
      folderInput.addEventListener("change", () => { uploadAll(folderInput.files); folderInput.value = ""; });

      ["dragenter", "dragover"].forEach((evt) =>
        dropZone.addEventListener(evt, (e) => {
          e.preventDefault();
          dropZone.classList.add("dragover");
        })
      );
      ["dragleave", "drop"].forEach((evt) =>
        dropZone.addEventListener(evt, (e) => {
          e.preventDefault();
          dropZone.classList.remove("dragover");
        })
      );
      dropZone.addEventListener("drop", (e) => {
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
          uploadAll(e.dataTransfer.files);
        }
      });
    })();
  </script>
</body>
</html>
