<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AI 工作台</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --sidebar-bg: #f9fafb;
      --hover: #f3f4f6;
      --active: #e5e7eb;
      --brand: #212121;
      --text: #1f2937;
      --text-muted: #6b7280;
      --text-light: #9ca3af;
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --border: #e5e7eb;
      --danger: #ef4444;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --sidebar-width: 260px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      height: 100dvh; overflow: hidden;
      display: flex;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, select, textarea, input { font: inherit; }

    /* ── sidebar ──────────────────────────────── */
    .sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      background: var(--sidebar-bg);
      display: flex; flex-direction: column;
      border-right: 1px solid var(--border);
      height: 100dvh;
    }

    .sidebar-header {
      padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .sidebar-logo {
      font-size: 18px; font-weight: 700;
      color: var(--brand); padding: 8px 4px 4px;
    }
    .new-chat-btn {
      width: 100%; min-height: 40px; border-radius: 8px;
      border: 1px solid var(--border); background: #fff;
      font-size: 14px; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      padding: 0 12px; color: var(--text);
      transition: background 0.15s;
    }
    .new-chat-btn:hover { background: var(--hover); }

    .sidebar-modes {
      padding: 0 12px 8px;
      display: flex; gap: 4px;
    }
    .mode-btn {
      flex: 1; min-height: 32px; border-radius: 6px;
      border: 1px solid var(--border); background: #fff;
      font-size: 12px; cursor: pointer;
      color: var(--text-muted); transition: all 0.15s;
    }
    .mode-btn.active {
      background: var(--accent-light); border-color: var(--accent);
      color: var(--accent); font-weight: 600;
    }

    .sidebar-scroll {
      flex: 1; overflow-y: auto;
      padding: 0 8px;
    }
    .sidebar-section { padding: 4px 0; }
    .sidebar-section-title {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--text-light);
      padding: 12px 8px 4px;
    }

    .history-item {
      width: 100%; border-radius: 8px;
      border: none; background: transparent;
      padding: 8px 10px; cursor: pointer;
      text-align: left;
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--text);
      transition: background 0.1s;
      overflow: hidden;
    }
    .history-item:hover { background: var(--hover); }
    .history-item.active { background: var(--active); }

    .history-item-title {
      flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 13px;
    }
    .history-item-meta {
      font-size: 11px; color: var(--text-light);
      flex-shrink: 0;
    }
    .history-item-del {
      width: 22px; height: 22px; border: none; border-radius: 6px;
      background: transparent; color: var(--text-light);
      cursor: pointer; font-size: 14px; display: none;
      align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .history-item:hover .history-item-del { display: flex; }
    .history-item-del:hover { color: var(--danger); background: rgba(239,68,68,.1); }

    .sidebar-footer {
      padding: 12px; border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 4px;
    }
    .sidebar-footer a {
      font-size: 12px; color: var(--text-light); text-decoration: none;
    }
    .sidebar-footer a:hover { color: var(--text); }

    /* ── main area ──────────────────────────────── */
    .main {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
      height: 100dvh;
    }

    .topbar {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      min-height: 52px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,.85);
      backdrop-filter: blur(8px);
      flex-shrink: 0;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-title { font-size: 16px; font-weight: 600; }
    .topbar-model {
      padding: 4px 10px; border-radius: 6px;
      border: 1px solid var(--border); background: #fff;
      font-size: 13px; color: var(--text);
      cursor: pointer;
    }
    .topbar-status {
      font-size: 12px; color: var(--text-light);
    }

    .chat-area {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
    }

    .panel { display: none; flex-direction: column; flex: 1 1 0; min-height: 0; }
    .panel.active { display: flex; }

    .messages, .media-results {
      flex: 1 1 0; min-height: 0;
      overflow-y: auto;
      padding: 24px 20px;
      scroll-behavior: smooth;
    }

    .messages-inner {
      max-width: 768px; margin: 0 auto;
    }

    .empty-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100%; text-align: center;
      max-width: 520px; margin: 0 auto;
    }
    .empty-state-icon {
      width: 64px; height: 64px; border-radius: 50%;
      background: var(--accent-light);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; margin-bottom: 16px;
    }
    .empty-state h2 {
      font-size: 24px; margin: 0 0 8px; font-weight: 600;
    }
    .empty-state p { color: var(--text-muted); font-size: 14px; line-height: 1.6; margin: 0; }

    .message {
      display: flex; gap: 16px;
      padding: 16px 0;
      max-width: 768px; margin: 0 auto;
    }
    .message-avatar {
      width: 30px; height: 30px; border-radius: 2px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; flex-shrink: 0;
    }
    .message.user .message-avatar {
      background: #374151; color: #fff;
    }
    .message.assistant .message-avatar {
      background: #2563eb; color: #fff;
    }
    .message-content {
      flex: 1; min-width: 0;
      line-height: 1.75; font-size: 15px;
    }
    .message-content p { margin: 0 0 8px; }
    .message-content p:last-child { margin-bottom: 0; }
    .message-content pre {
      background: #1e293b; color: #e2e8f0; padding: 12px 16px;
      border-radius: 8px; overflow-x: auto; font-size: 13px;
    }
    .message-content code { font-size: 13px; }
    .message-content.error { color: var(--danger); }

    .bubble-loading { color: var(--text-light); font-style: italic; }

    .media-results-inner {
      max-width: 768px; margin: 0 auto;
      display: grid; gap: 16px;
    }
    .result-card {
      border-radius: 12px; border: 1px solid var(--border);
      background: var(--sidebar-bg); overflow: hidden;
    }
    .result-card img, .result-card video {
      display: block; width: 100%; max-height: 60vh;
      object-fit: contain; background: #000;
    }
    .result-card-meta { padding: 10px 14px; font-size: 12px; color: var(--text-muted); }
    .result-dl-btn {
      display: block; padding: 8px 14px;
      font-size: 13px; color: var(--accent); text-decoration: none;
      border-top: 1px solid var(--border);
      transition: background .15s;
    }
    .result-dl-btn:hover { background: var(--accent-light); }
    .result-card.error { background: rgba(239,68,68,.06); color: var(--danger); padding: 12px 14px; }

    .status-bar {
      text-align: center; padding: 8px; font-size: 12px;
      color: var(--text-light); flex-shrink: 0;
    }

    .composer-wrap {
      flex-shrink: 0;
      padding: 0 20px 20px;
    }
    .composer {
      max-width: 768px; margin: 0 auto;
      border: 1px solid var(--border); border-radius: 16px;
      background: #fff;
      box-shadow: 0 0 8px rgba(0,0,0,.04);
      display: flex; align-items: flex-end; gap: 8px;
      padding: 8px 12px;
    }
    .composer textarea {
      flex: 1; border: none; outline: none; resize: none;
      background: transparent; font-size: 15px; line-height: 1.5;
      color: var(--text); padding: 4px 0;
      min-height: 24px; max-height: 160px;
    }
    .composer textarea::placeholder { color: var(--text-light); }
    .composer .send-btn {
      width: 32px; height: 32px; border: none; border-radius: 8px;
      background: var(--text); color: #fff;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0; transition: background .15s;
    }
    .composer .send-btn:hover { background: #374151; }
    .composer .send-btn:disabled { opacity: 0.4; cursor: default; }

    /* ── mobile overlay ────────────────────────── */
    .mobile-hamburger {
      display: none;
      width: 36px; height: 36px; border: none; border-radius: 8px;
      background: transparent; cursor: pointer;
      flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    }
    .mobile-hamburger span {
      display: block; width: 18px; height: 2px; border-radius: 2px;
      background: var(--text);
    }

    .overlay {
      display: none;
      position: fixed; inset: 0; z-index: 40;
      background: rgba(0,0,0,.4);
    }
    .overlay.open { display: block; }

    @media (max-width: 767px) {
      .sidebar {
        position: fixed; top: 0; left: 0; bottom: 0; z-index: 50;
        transform: translateX(-100%);
        transition: transform .25s ease;
        box-shadow: 2px 0 16px rgba(0,0,0,.12);
      }
      .sidebar.open { transform: translateX(0); }

      .mobile-hamburger { display: flex; }
      .topbar { padding: 10px 14px; }
      .messages { padding: 16px 14px; }
      .composer-wrap { padding: 0 12px 12px; }
      .composer { border-radius: 24px; padding: 6px 8px 6px 14px; }
      .message { padding: 12px 0; gap: 10px; }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">AI 工作台</div>
      <button class="new-chat-btn" id="newChatBtn">+ 新对话</button>
    </div>

    <div class="sidebar-modes">
      <button class="mode-btn active" data-mode="chat">💬 对话</button>
      <button class="mode-btn" data-mode="image">🖼 图片</button>
      <button class="mode-btn" data-mode="video">🎬 视频</button>
    </div>

    <div class="sidebar-scroll" id="sidebarScroll">
      <div class="sidebar-section">
        <div class="sidebar-section-title" id="historySectionTitle">对话记录</div>
        <div id="historyList"></div>
      </div>
    </div>

    <div class="sidebar-footer">
      <a href="../../">← 返回工具入口</a>
    </div>
  </aside>

  <!-- Overlay for mobile -->
  <div class="overlay" id="overlay"></div>

  <!-- Main -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="mobile-hamburger" id="hamburgerBtn" aria-label="菜单">
          <span></span><span></span><span></span>
        </button>
        <span class="topbar-title" id="modeTitle">对话</span>
      </div>
      <div class="topbar-right">
        <select class="topbar-model" id="modelSelect"></select>
        <span class="topbar-status" id="statusText">准备就绪</span>
      </div>
    </header>

    <div class="chat-area">
      <div class="panel active" id="chatPanel">
        <div class="messages" id="messages">
          <div class="messages-inner">
            <div class="empty-state" id="emptyState">
              <div class="empty-state-icon">✨</div>
              <h2>今天想聊什么？</h2>
              <p>选择模型后输入问题，AI 将为你回答。</p>
            </div>
          </div>
        </div>
      </div>

      <div class="panel" id="mediaPanel">
        <div class="media-results" id="mediaResults">
          <div class="empty-state" id="mediaEmptyState" style="padding-top:60px;">
            <div class="empty-state-icon">🎨</div>
            <h2 id="mediaEmptyTitle">描述你想生成的画面</h2>
            <p id="mediaEmptyText">选择模型后输入提示词，结果会显示在这里。</p>
          </div>
        </div>
      </div>
    </div>

    <div class="composer-wrap">
      <div id="aiProgressSlot"></div>
      <form class="composer" id="chatForm">
        <textarea id="promptInput" placeholder="输入消息..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn" type="submit" aria-label="发送">↑</button>
      </form>
    </div>
  </main>

  <script src="../../config/ai.config.js"></script>
  <script src="../shared/ai-auth.js"></script>
  <script src="../shared/ai-progress.js"></script>
  <script src="./chat.js"></script>
</body>
</html>
