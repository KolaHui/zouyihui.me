<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2522">
  <meta name="color-scheme" content="light">
  <title>笔记 · 我的个人空间</title>
  <link rel="icon" href="../../assets/mark.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-synthesis: none;
      --ink: #232724;
      --muted: #7a817c;
      --paper: #fbfaf6;
      --paper-deep: #f2f0e9;
      --rail: #1f2522;
      --rail-soft: #2b322e;
      --line: rgba(53, 63, 57, .12);
      --green: #4f8b72;
      --blue: #4d8fb8;
      --danger: #b35b56;
      --focus: rgba(79, 139, 114, .24);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; }
    body { margin: 0; overflow: hidden; color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    [hidden] { display: none !important; }
    .boot {
      position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(circle at 50% 42%, rgba(111, 164, 139, .13), transparent 28rem), var(--paper);
    }
    .boot-card { width: min(390px, 100%); text-align: center; }
    .boot-mark { width: 58px; height: 58px; margin-bottom: 22px; }
    .boot h1 { margin: 0; font: 700 30px/1.2 "Songti SC", "STSong", serif; letter-spacing: -.03em; }
    .boot p { margin: 13px 0 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .boot a { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; margin-top: 22px; padding: 0 20px; border-radius: 14px; color: #fff; background: var(--rail); text-decoration: none; }
    .app { height: 100dvh; display: grid; grid-template-columns: 304px minmax(0, 1fr); }
    .sidebar {
      position: relative; z-index: 20; min-width: 0; display: flex; flex-direction: column; overflow: hidden;
      color: rgba(255,255,255,.9); background:
        radial-gradient(circle at 10% 0%, rgba(108, 164, 139, .16), transparent 19rem),
        linear-gradient(160deg, #252c28, var(--rail) 68%);
      box-shadow: 12px 0 36px rgba(27, 36, 31, .08);
    }
    .vault-head { display: flex; align-items: center; gap: 12px; min-height: 78px; padding: max(14px, env(safe-area-inset-top)) 17px 10px; }
    .home { width: 43px; height: 43px; display: grid; place-items: center; flex: none; border: 1px solid rgba(255,255,255,.11); border-radius: 14px; background: rgba(255,255,255,.055); }
    .home img { width: 31px; height: 31px; filter: saturate(.7) brightness(1.2); }
    .vault-title { min-width: 0; flex: 1; }
    .vault-title strong { display: block; font: 670 14px/1.2 "Songti SC", serif; letter-spacing: .04em; }
    .vault-title span { display: block; margin-top: 4px; color: rgba(255,255,255,.4); font: 600 9px/1 ui-monospace, "SFMono-Regular", Menlo, monospace; letter-spacing: .13em; text-transform: uppercase; }
    .icon-btn { width: 42px; height: 42px; display: grid; place-items: center; flex: none; border: 0; border-radius: 13px; cursor: pointer; transition: background 160ms ease, transform 100ms ease, color 160ms ease; }
    .icon-btn:hover { background: rgba(255,255,255,.09); }
    .icon-btn:active { transform: scale(.94); }
    .new-note { color: #fff; background: rgba(255,255,255,.1); }
    .search-wrap { position: relative; margin: 11px 16px 14px; }
    .search-wrap::before { content: "⌕"; position: absolute; left: 13px; top: 50%; color: rgba(255,255,255,.42); font-size: 19px; transform: translateY(-53%); pointer-events: none; }
    .search { width: 100%; height: 42px; padding: 0 13px 0 38px; border: 1px solid rgba(255,255,255,.07); border-radius: 13px; outline: 0; color: #fff; background: rgba(255,255,255,.055); font-size: 13px; }
    .search::placeholder { color: rgba(255,255,255,.34); }
    .search:focus { border-color: rgba(129,190,162,.5); box-shadow: 0 0 0 4px rgba(89,151,122,.12); }
    .folders { display: flex; gap: 7px; overflow-x: auto; padding: 0 16px 12px; scrollbar-width: none; }
    .folders::-webkit-scrollbar { display: none; }
    .folder-chip { min-height: 32px; padding: 0 11px; border: 1px solid rgba(255,255,255,.075); border-radius: 999px; color: rgba(255,255,255,.48); background: transparent; font-size: 11px; white-space: nowrap; cursor: pointer; }
    .folder-chip[aria-pressed="true"] { color: #f4fff8; border-color: rgba(120,182,153,.32); background: rgba(101,165,135,.18); }
    .note-list { flex: 1; overflow-y: auto; padding: 2px 9px 20px; scrollbar-color: rgba(255,255,255,.14) transparent; }
    .note-card { width: 100%; display: block; padding: 14px 13px; border: 1px solid transparent; border-radius: 14px; color: inherit; background: transparent; text-align: left; cursor: pointer; transition: background 150ms ease, border-color 150ms ease, transform 150ms ease; }
    .note-card + .note-card { margin-top: 3px; }
    .note-card:hover { background: rgba(255,255,255,.045); }
    .note-card[aria-current="true"] { border-color: rgba(134,190,164,.13); background: rgba(113,170,143,.12); }
    .note-card strong { display: block; overflow: hidden; color: rgba(255,255,255,.9); font-size: 13px; font-weight: 610; text-overflow: ellipsis; white-space: nowrap; }
    .note-card span { display: block; overflow: hidden; margin-top: 6px; color: rgba(255,255,255,.36); font-size: 11px; line-height: 1.45; text-overflow: ellipsis; white-space: nowrap; }
    .note-card small { display: block; margin-top: 8px; color: rgba(255,255,255,.25); font: 500 9px/1 ui-monospace, Menlo, monospace; }
    .list-empty { padding: 44px 18px; color: rgba(255,255,255,.38); font-size: 12px; line-height: 1.8; text-align: center; }
    .sidebar-foot { padding: 13px 17px max(15px, env(safe-area-inset-bottom)); border-top: 1px solid rgba(255,255,255,.065); color: rgba(255,255,255,.3); font-size: 10px; }
    .sidebar-foot::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 7px; border-radius: 50%; background: #70b78f; box-shadow: 0 0 0 4px rgba(112,183,143,.08); }
    .editor-shell { position: relative; min-width: 0; display: flex; flex-direction: column; background:
      linear-gradient(rgba(72, 81, 75, .026) 1px, transparent 1px) 0 0 / 100% 34px,
      var(--paper); }
    .editor-bar { min-height: 64px; display: flex; align-items: center; gap: 9px; padding: 10px 21px; border-bottom: 1px solid var(--line); background: rgba(251,250,246,.86); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
    .mobile-menu { display: none; background: transparent; }
    .crumb { min-width: 0; flex: 1; color: var(--muted); font-size: 11px; }
    .crumb strong { color: #4e5751; font-weight: 620; }
    .view-switch { display: flex; padding: 3px; border: 1px solid var(--line); border-radius: 11px; background: rgba(230,228,221,.48); }
    .view-switch button { min-height: 34px; padding: 0 12px; border: 0; border-radius: 8px; color: var(--muted); background: transparent; font-size: 11px; cursor: pointer; }
    .view-switch button[aria-pressed="true"] { color: var(--ink); background: #fff; box-shadow: 0 2px 8px rgba(41,48,44,.08); }
    .delete-note { color: #9b706c; background: transparent; }
    .note-workspace { flex: 1; min-height: 0; overflow: hidden; }
    .editor-grid { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .9fr); }
    .writing-pane { min-width: 0; display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid var(--line); background: rgba(251,250,246,.83); }
    .note-fields { padding: clamp(27px, 4.5vw, 58px) clamp(24px, 6vw, 76px) 18px; }
    .note-title { width: 100%; padding: 0; border: 0; outline: 0; color: var(--ink); background: transparent; font: 750 clamp(30px, 4.2vw, 50px)/1.18 "Songti SC", "STSong", serif; letter-spacing: -.045em; }
    .note-title::placeholder { color: #c0c2bd; }
    .folder-field { display: flex; align-items: center; gap: 8px; width: min(360px,100%); margin-top: 17px; color: #9aa099; }
    .folder-field span { font-size: 13px; }
    .note-folder { min-width: 0; width: 100%; height: 34px; padding: 0 8px; border: 0; border-bottom: 1px solid transparent; outline: 0; color: #717972; background: transparent; font-size: 12px; }
    .note-folder:focus { border-bottom-color: rgba(79,139,114,.35); }
    .note-content { flex: 1; width: 100%; min-height: 0; resize: none; padding: 10px clamp(24px, 6vw, 76px) 80px; border: 0; outline: 0; color: #3b423d; background: transparent; font: 400 16px/1.9 "Iowan Old Style", "Songti SC", "STSong", serif; letter-spacing: .012em; caret-color: var(--green); }
    .note-content::placeholder { color: #afb3ad; }
    .preview-pane { overflow-y: auto; padding: clamp(34px, 6vw, 72px) clamp(26px, 5vw, 68px) 100px; background: rgba(243,241,234,.64); }
    .preview-label { margin-bottom: 28px; color: #9ba09b; font: 650 9px/1 ui-monospace, Menlo, monospace; letter-spacing: .16em; text-transform: uppercase; }
    .markdown { max-width: 720px; color: #414743; font: 400 16px/1.85 "Iowan Old Style", "Songti SC", serif; word-break: break-word; }
    .markdown h1, .markdown h2, .markdown h3 { color: #252a27; font-family: "Songti SC", "STSong", serif; line-height: 1.35; }
    .markdown h1 { margin: 0 0 25px; font-size: 34px; }
    .markdown h2 { margin: 34px 0 15px; font-size: 25px; }
    .markdown h3 { margin: 28px 0 12px; font-size: 20px; }
    .markdown p { margin: 0 0 1em; }
    .markdown ul { padding-left: 1.35em; }
    .markdown blockquote { margin: 1.3em 0; padding: 5px 0 5px 18px; border-left: 3px solid rgba(79,139,114,.45); color: #6f7871; }
    .markdown code { padding: 2px 5px; border-radius: 5px; background: rgba(48,59,52,.07); font: .88em ui-monospace, Menlo, monospace; }
    .preview-empty { color: #a0a59f; font-style: italic; }
    .empty-editor { height: 100%; display: grid; place-items: center; padding: 28px; text-align: center; }
    .empty-editor-inner { max-width: 360px; }
    .empty-symbol { width: 70px; height: 70px; display: grid; place-items: center; margin: 0 auto 22px; border: 1px solid var(--line); border-radius: 24px; color: var(--green); background: rgba(255,255,255,.64); font: 700 30px/1 "Songti SC", serif; box-shadow: 0 18px 50px rgba(41,55,47,.08); }
    .empty-editor h2 { margin: 0; font: 700 28px/1.3 "Songti SC", serif; }
    .empty-editor p { margin: 11px 0 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .primary { min-height: 44px; margin-top: 19px; padding: 0 18px; border: 0; border-radius: 13px; color: #fff; background: var(--rail); cursor: pointer; }
    .word-count { position: absolute; left: clamp(24px, 6vw, 76px); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 4; color: #a0a59f; font: 550 10px/1 ui-monospace, Menlo, monospace; pointer-events: none; }
    .sync-indicator {
      position: fixed; right: 22px; bottom: max(18px, env(safe-area-inset-bottom)); z-index: 30; min-height: 42px;
      display: flex; align-items: center; gap: 9px; padding: 0 14px 0 11px; border: 1px solid rgba(57,72,63,.11); border-radius: 14px;
      color: #6c766f; background: rgba(255,255,255,.82); box-shadow: 0 10px 34px rgba(42,55,48,.11), inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); font-size: 11px; transition: color 180ms ease, border-color 180ms ease, transform 180ms ease;
    }
    .sync-indicator svg { width: 22px; height: 22px; overflow: visible; }
    .sync-cloud { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .sync-check { fill: none; stroke: var(--green); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transform-origin: center; transform: scale(.6); transition: opacity 180ms ease, transform 240ms cubic-bezier(.2,.9,.2,1); }
    .sync-orbit { fill: var(--blue); opacity: 0; transform-origin: 11px 11px; }
    .sync-indicator[data-state="saving"] { color: var(--blue); }
    .sync-indicator[data-state="saving"] .sync-orbit { opacity: 1; animation: orbit 900ms linear infinite; }
    .sync-indicator[data-state="saved"] { color: var(--green); border-color: rgba(79,139,114,.2); }
    .sync-indicator[data-state="saved"] .sync-check { opacity: 1; transform: scale(1); }
    .sync-indicator[data-state="error"] { color: var(--danger); border-color: rgba(179,91,86,.22); }
    .scrim { display: none; }
    :focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @media (max-width: 1100px) {
      .editor-grid { display: block; }
      .writing-pane, .preview-pane { height: 100%; border-right: 0; }
      .editor-grid[data-mode="write"] .preview-pane { display: none; }
      .editor-grid[data-mode="preview"] .writing-pane { display: none; }
    }
    @media (min-width: 1101px) { .view-switch { display: none; } }
    @media (max-width: 760px) {
      body { overflow: hidden; }
      .app { grid-template-columns: 1fr; }
      .sidebar { position: fixed; inset: 0 auto 0 0; width: min(86vw, 318px); transform: translateX(-104%); transition: transform 280ms cubic-bezier(.2,.9,.2,1); }
      .app[data-sidebar="open"] .sidebar { transform: none; }
      .scrim { position: fixed; inset: 0; z-index: 15; display: block; border: 0; background: rgba(20,27,23,.32); opacity: 0; pointer-events: none; transition: opacity 220ms ease; backdrop-filter: blur(2px); }
      .app[data-sidebar="open"] .scrim { opacity: 1; pointer-events: auto; }
      .mobile-menu { display: grid; }
      .editor-bar { min-height: 58px; padding: max(8px, env(safe-area-inset-top)) 10px 8px; }
      .crumb { font-size: 10px; }
      .note-fields { padding: 28px 20px 15px; }
      .note-title { font-size: 34px; }
      .note-content { padding: 8px 20px 92px; font-size: 16px; }
      .preview-pane { padding: 32px 21px 100px; }
      .word-count { left: 20px; bottom: max(19px, env(safe-area-inset-bottom)); }
      .sync-indicator { right: 12px; bottom: max(11px, env(safe-area-inset-bottom)); max-width: calc(100% - 100px); }
      .sync-indicator span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
    @media (prefers-reduced-transparency: reduce) { .editor-bar, .sync-indicator { background: #fff; backdrop-filter: none; -webkit-backdrop-filter: none; } }
  </style>
  <script src="../../config/portal.config.js"></script>
  <script src="./notes.js" defer></script>
</head>
<body>
  <section class="boot" id="bootScreen" aria-live="polite">
    <div class="boot-card">
      <img class="boot-mark" src="../../assets/mark.svg" alt="">
      <h1 id="bootTitle">正在打开笔记库</h1>
      <p id="bootMessage">正在建立与 Mac 本地数据库的安全连接…</p>
      <a id="bootAction" href="../../personal/" hidden>返回我的个人空间</a>
    </div>
  </section>

  <main class="app" id="noteApp" data-sidebar="closed" hidden>
    <aside class="sidebar" id="vaultSidebar" aria-label="笔记导航">
      <header class="vault-head">
        <a class="home" href="../../personal/" aria-label="返回我的个人空间"><img src="../../assets/mark.svg" alt=""></a>
        <div class="vault-title"><strong>邹奕辉的笔记</strong><span>Local knowledge vault</span></div>
        <button class="icon-btn new-note" id="newNoteBtn" type="button" aria-label="新建笔记">＋</button>
      </header>
      <label class="search-wrap"><span hidden>搜索笔记</span><input class="search" id="searchInput" type="search" placeholder="搜索标题或内容摘要" autocomplete="off"></label>
      <nav class="folders" id="folderNav" aria-label="笔记文件夹"></nav>
      <div class="note-list" id="noteList" aria-live="polite"></div>
      <footer class="sidebar-foot">数据存储于当前 Mac 的 SQLite</footer>
    </aside>

    <button class="scrim" id="sidebarScrim" type="button" aria-label="关闭笔记导航"></button>

    <section class="editor-shell">
      <header class="editor-bar">
        <button class="icon-btn mobile-menu" id="mobileMenuBtn" type="button" aria-label="打开笔记导航">☰</button>
        <div class="crumb"><strong id="crumbFolder">笔记库</strong><span id="crumbTitle"> · 选择一篇笔记</span></div>
        <div class="view-switch" role="group" aria-label="编辑模式">
          <button type="button" data-view="write" aria-pressed="true">编辑</button>
          <button type="button" data-view="preview" aria-pressed="false">预览</button>
        </div>
        <button class="icon-btn delete-note" id="deleteNoteBtn" type="button" aria-label="删除当前笔记" disabled>⌫</button>
      </header>

      <div class="note-workspace">
        <section class="empty-editor" id="emptyEditor">
          <div class="empty-editor-inner"><div class="empty-symbol">记</div><h2>把想法放在这里</h2><p>新建一篇笔记后，输入内容会实时同步到你的 Mac 本地数据库。</p><button class="primary" id="emptyCreateBtn" type="button">新建第一篇笔记</button></div>
        </section>

        <div class="editor-grid" id="editorGrid" data-mode="write" hidden>
          <section class="writing-pane" aria-label="Markdown 编辑器">
            <div class="note-fields">
              <input class="note-title" id="noteTitle" type="text" maxlength="200" placeholder="未命名笔记" aria-label="笔记标题">
              <label class="folder-field"><span aria-hidden="true">⌁</span><input class="note-folder" id="noteFolder" type="text" maxlength="100" placeholder="未分类" aria-label="笔记文件夹"></label>
            </div>
            <textarea class="note-content" id="noteContent" maxlength="200000" placeholder="从一个想法开始……\n\n支持 Markdown：# 标题、- 列表、> 引用、**重点**" spellcheck="true" aria-label="笔记内容"></textarea>
          </section>
          <aside class="preview-pane" aria-label="Markdown 预览"><div class="preview-label">Reading view</div><article class="markdown" id="markdownPreview"></article></aside>
        </div>
      </div>

      <div class="word-count" id="wordCount" hidden>0 字</div>
      <div class="sync-indicator" id="syncIndicator" data-state="idle" role="status" aria-live="polite" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="sync-cloud" d="M7.1 18.2h10.2a4 4 0 0 0 .4-8 6.1 6.1 0 0 0-11.6 1.6A3.3 3.3 0 0 0 7.1 18.2Z"/><path class="sync-check" d="m9.2 14.1 1.8 1.8 4-4.1"/><circle class="sync-orbit" cx="11" cy="3.2" r="1.5"/></svg>
        <span id="syncText">等待编辑</span>
      </div>
    </section>
  </main>
</body>
</html>
